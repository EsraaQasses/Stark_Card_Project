<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Admin Login Verification</title>
  </head>
  <body>
    <p>Hello {{ user_name }},</p>
    <p>Your admin login verification code is:</p>
    <h2>{{ otp_code }}</h2>
    <p>This code expires in {{ expiry_minutes }} minutes.</p>
    <p>IP address: {{ ip_address|default:"Unknown" }}</p>
    <p>Device: {{ device_info|default:"Unknown" }}</p>
    <p>If you did not request this, please secure your account immediately.</p>
  </body>
</html>
