[pytest]
DJANGO_SETTINGS_MODULE = stark_backend.settings
python_files = tests.py test_*.py *_tests.py
addopts = --strict-markers --reuse-db
testpaths = .
norecursedirs = .git .pytest_cache backups media staticfiles starkiano_env
markers =
    contract: OpenAPI/API contract tests
    staging: tests that require a running staging server
